<!DOCTYPE html>
<html>
<head>
    <title>Create Advertisement - ARENA</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .preview-box {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .ad-preview {
            max-width: 300px;
            margin: 20px auto;
            border: 2px dashed var(--primary);
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <i class="fas fa-trophy logo-icon"></i>
                <span>ARENA Ads</span>
            </a>
            <div class="nav-links">
                <a href="/ads" class="btn"><i class="fas fa-arrow-left"></i> Back</a>
                <a href="/logout" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 100px;">
        <div class="card">
            <h1><i class="fas fa-plus-circle"></i> Create New Advertisement</h1>
            <p style="color: #a0aec0; margin-bottom: 30px;">
                Reach thousands of gamers with your advertisement
            </p>

            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Ad Title *</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g., Razer Gaming Keyboard" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Describe your product or service..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Image URL</label>
                    <input type="url" name="image_url" class="form-control" placeholder="https://example.com/image.jpg">
                    <small style="color: #a0aec0;">Leave empty for default image</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Redirect URL *</label>
                    <input type="url" name="redirect_url" class="form-control" placeholder="https://your-website.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Category *</label>
                    <select name="category" class="form-control" required>
                        <option value="">Select a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}">{{ category|replace('_', ' ')|title }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Target Games (Optional)</label>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;">
                        {% for game in popular_games %}
                        <label style="display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" name="target_games" value="{{ game }}">
                            {{ game }}
                        </label>
                        {% endfor %}
                    </div>
                    <small style="color: #a0aec0;">Select games to target your ad</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Ad Position *</label>
                    <select name="position" class="form-control" required>
                        <option value="sidebar">Sidebar (300x250)</option>
                        <option value="banner">Banner (728x90)</option>
                        <option value="tournament_sponsor">Tournament Sponsor Card</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Budget ($) *</label>
                    <input type="number" name="budget" class="form-control" min="10" step="0.01" value="100.00" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-large">
                    <i class="fas fa-rocket"></i> Launch Advertisement
                </button>
            </form>

            <div class="preview-box">
                <h3><i class="fas fa-eye"></i> Preview</h3>
                <div class="ad-preview">
                    <div style="background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); padding: 15px; text-align: center;">
                        <strong style="color: white;">Ad Preview</strong>
                    </div>
                    <div style="padding: 15px; text-align: center;">
                        <div style="width: 100%; height: 150px; background: rgba(255,255,255,0.1); 
                                 display: flex; align-items: center; justify-content: center; margin-bottom: 15px;">
                            <i class="fas fa-image" style="font-size: 2rem; color: var(--gray);"></i>
                        </div>
                        <strong>Your Ad Title Here</strong>
                        <p style="color: var(--gray); font-size: 0.9rem; margin: 10px 0;">
                            Your description will appear here
                        </p>
                        <button class="btn btn-primary" style="width: 100%;">
                            <i class="fas fa-external-link-alt"></i> Learn More
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
